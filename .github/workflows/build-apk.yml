name: Build Cashier-V1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Prepare web files and Capacitor config
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            if [ -f index.html ]; then
              cp index.html www/index.html
            elif [ -f Index.html ]; then
              cp Index.html www/index.html
            else
              echo "ERROR: index.html not found in repo!"
              exit 1
            fi
          fi
          if [ ! -f capacitor.config.json ]; then
            printf '%s\n' '{"appId":"com.cashierv1.app","appName":"Cashier-V1","webDir":"www","android":{"allowMixedContent":true}}' > capacitor.config.json
          fi

      - name: Initialize Capacitor and Android Project
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashier-v1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
